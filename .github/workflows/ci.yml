name: CI

# Every push and every pull request lints and tests both services (with a
# 70% coverage gate), validates system.yaml and the OpenAPI documents, runs
# the cross-seam integration test on the compose stack, and builds both
# images. Only a push to main publishes the images to GHCR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalogue, shows]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests use a SQL Server container, never Azure SQL. Passwords are
      # random for each run, so none is written in this file. ::add-mask::
      # hides them if they ever appear in the log. GITHUB_ENV passes them to
      # the next steps as environment variables.
      - name: Make passwords for the test SQL Server
        run: |
          for name in MSSQL_SA_PASSWORD CATALOGUE_DB_PASSWORD SHOWS_DB_PASSWORD; do
            password="Ci_$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            echo "$name=$password" >> "$GITHUB_ENV"
          done
      # Same sqlserver and db-init as locally: compose reads the passwords
      # above instead of its LocalOnly defaults. run waits for the
      # healthcheck, then db-init creates the databases and logins.
      - name: Start SQL Server and create the databases
        working-directory: .
        run: docker compose run --rm db-init
      # Each matrix job uses its own login and its own *_test database.
      - name: Point the tests at the test database
        run: |
          if [ "${{ matrix.service }}" = "catalogue" ]; then
            password="$CATALOGUE_DB_PASSWORD"
          else
            password="$SHOWS_DB_PASSWORD"
          fi
          echo "TEST_DATABASE_URL=mssql://${{ matrix.service }}_app:${password}@127.0.0.1:1433/${{ matrix.service }}_test" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      # Rules in services/NAME/ruff.toml. Any finding fails the job.
      - name: Lint
        run: ruff check .
      # Coverage of everything in app/ (the tests are left out by
      # .coveragerc); below 70% fails the job. --cov-report shows which
      # lines are missed.
      - name: Test with the coverage gate
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70

  # The machine-readable description of the system (brief, section 8a).
  # The tools are pinned here and installed only in CI, never in an image.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      # Our own schema (none was provided): a missing, misspelt or extra
      # field in system.yaml fails the job.
      - name: Validate system.yaml against system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Validate each openapi.yaml against the OpenAPI specification
        run: openapi-spec-validator services/catalogue/openapi.yaml services/shows/openapi.yaml
      # The services share no code: these files are copied into both on
      # purpose (ADR-9). cmp fails the step on the first byte that differs,
      # so a fix made in one copy only cannot go unnoticed.
      - name: Check that the copied files are still identical
        run: |
          for file in app/db.py app/migrate.py app/request_log.py app/cors.py app/health.py tests/test_system_yaml.py; do
            cmp services/catalogue/$file services/shows/$file
          done

  # The cross-seam test: shows calling the REAL catalogue, on the whole
  # system started by compose (real images, real SQL Server, the compose
  # network), then the same calls with the catalogue stopped.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Random passwords for this run, as in the test job: compose reads
      # them instead of its LocalOnly defaults.
      - name: Make passwords for SQL Server
        run: |
          for name in MSSQL_SA_PASSWORD CATALOGUE_DB_PASSWORD SHOWS_DB_PASSWORD; do
            password="Ci_$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            echo "$name=$password" >> "$GITHUB_ENV"
          done
      # Builds both images and starts everything; up waits for each
      # depends_on condition (SQL Server healthy, db-init done) on the way.
      - name: Start the whole system
        run: docker compose up -d --build
      - run: pip install -r tests/integration/requirements.txt
      # Same rules as the services' ruff.toml.
      - name: Lint
        run: ruff check tests/integration --line-length 100 --select E,W,F,I,B
      # The test waits for both /health endpoints itself before it starts.
      - name: Cross-seam integration test
        run: python -m pytest tests/integration -v
      - name: Service logs, if anything failed
        if: failure()
        run: docker compose logs catalogue shows

  images:
    # Nothing is built for GHCR unless the tests, the system description
    # and the cross-seam test all pass.
    needs: [test, validate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [catalogue, shows]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/tribute-${{ matrix.service }}:${{ github.sha }}
          # /health reports this as "version": the same SHA as the image tag.
          build-args: GIT_SHA=${{ github.sha }}