name: CI

# Every push and every pull request runs the tests and builds both images.
# Only a push to main publishes the images to GHCR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalogue, shows]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests use a SQL Server container, never Azure SQL. Passwords are
      # random for each run, so none is written in this file. ::add-mask::
      # hides them if they ever appear in the log. GITHUB_ENV passes them to
      # the next steps as environment variables.
      - name: Make passwords for the test SQL Server
        run: |
          for name in MSSQL_SA_PASSWORD CATALOGUE_DB_PASSWORD SHOWS_DB_PASSWORD; do
            password="Ci_$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            echo "$name=$password" >> "$GITHUB_ENV"
          done
      # Same sqlserver and db-init as locally: compose reads the passwords
      # above instead of its LocalOnly defaults. run waits for the
      # healthcheck, then db-init creates the databases and logins.
      - name: Start SQL Server and create the databases
        working-directory: .
        run: docker compose run --rm db-init
      - name: Point the tests at the test database
        run: echo "TEST_DATABASE_URL=mssql://catalogue_app:${CATALOGUE_DB_PASSWORD}@127.0.0.1:1433/catalogue_test" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [catalogue, shows]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/tribute-${{ matrix.service }}:${{ github.sha }}